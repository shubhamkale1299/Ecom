spring:
  application:
    name: Ecom

  datasource:
    url: jdbc:postgresql://localhost:5432/ecomdb?options=-c%20TimeZone=Asia/kolkata
    username: embarkx
    password: embarkx

  jpa:
    database: POSTGRESQL
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
